# Deployment wired to the ConfigMap, Secret, and PVC above.
# Replace <ACR_LOGIN_SERVER> before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  labels:
    app: inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
    spec:
      containers:
      - name: inference-api
        image: <ACR_LOGIN_SERVER>/inference-api:v1
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: inference-api-config
        env:
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference-api-secret
              key: MODEL_API_KEY
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: inference-api-data
